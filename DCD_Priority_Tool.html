<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DCD Priority Work List</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root {
    --bg: #0e0f13; --surface: #16181f; --surface2: #1e2029; --border: #2a2c38;
    --accent: #e8523a; --accent2: #3a7bd5; --text: #e8e9ed; --muted: #6b6f82;
    --rank1-bg: #2a1a17; --rank1-alt: #241512; --rank2-bg: #131c2e; --rank2-alt: #101827;
    --green: #2ecc71; --done-bg: #0f1f14; --done-alt: #0d1b11;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; min-height: 100vh; }
  header { padding: 1.5rem 2.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1.2rem; }
  .logo-mark { width: 40px; height: 40px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; color: white; flex-shrink: 0; }
  header h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; }
  header p { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .header-right { margin-left: auto; text-align: right; }
  #date-badge { font-size: 0.65rem; color: var(--muted); }
  #last-updated { font-size: 0.65rem; color: var(--green); display: none; margin-top: 2px; }
  #loading-bar { padding: 3rem 2.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-msg { font-size: 0.75rem; color: var(--muted); }
  #error-msg { display: none; padding: 2rem 2.5rem; color: var(--accent); font-size: 0.8rem; line-height: 1.6; }
  #stats-bar { display: none; padding: 1rem 2.5rem; border-bottom: 1px solid var(--border); gap: 2.5rem; align-items: center; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat-label { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .stat-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.1rem; }
  .stat-value.r1 { color: var(--accent); }
  .stat-value.r2 { color: var(--accent2); }
  .stat-value.done { color: var(--green); }
  #actions-bar { display: none; padding: 1rem 2.5rem; border-bottom: 1px solid var(--border); gap: 1rem; align-items: center; flex-wrap: wrap; }
  #search-input { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; padding: 0.45rem 0.85rem; border-radius: 2px; width: 250px; outline: none; }
  #search-input:focus { border-color: var(--muted); }
  #show-done-btn, #export-btn, #refresh-btn, #reset-btn { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; padding: 0.5rem 1.2rem; cursor: pointer; border-radius: 2px; transition: opacity 0.2s; }
  #export-btn { background: transparent; color: var(--accent2); border: 1px solid var(--accent2); }
  #export-btn:hover { opacity: 0.75; }
  #refresh-btn { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  #refresh-btn:hover { color: var(--text); border-color: var(--muted); }
  #show-done-btn { background: transparent; color: var(--green); border: 1px solid var(--green); }
  #show-done-btn:hover { opacity: 0.75; }
  #reset-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #reset-btn:hover { opacity: 0.75; }
  #row-count { font-size: 0.65rem; color: var(--muted); margin-left: auto; }
  #table-wrap { padding: 1.5rem 2.5rem 3rem; overflow-x: auto; display: none; }
  table { width: 100%; border-collapse: collapse; font-size: 0.72rem; }
  thead tr { background: var(--surface2); border-bottom: 2px solid var(--border); }
  th { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0.6rem 0.8rem; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  td { padding: 0.45rem 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.03); white-space: nowrap; }
  tr.rank1 td { background: var(--rank1-bg); }
  tr.rank1:nth-child(even) td { background: var(--rank1-alt); }
  tr.rank2 td { background: var(--rank2-bg); }
  tr.rank2:nth-child(even) td { background: var(--rank2-alt); }
  tr.completed td { background: var(--done-bg) !important; opacity: 0.5; }
  tr.completed td .part-id { text-decoration: line-through; }
  tr:hover td { filter: brightness(1.2); }
  .badge { display: inline-block; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.6rem; padding: 2px 8px; border-radius: 2px; color: white; }
  .badge-1 { background: var(--accent); }
  .badge-2 { background: var(--accent2); }
  .part-id { font-weight: 500; }
  .num-cell { text-align: center; }
  .grade-A, .grade-M { color: #999; }
  .grade-B { color: #f0c040; }
  .grade-C { color: #f0a040; }
  .grade-S { color: #e87040; }
  .grade-X { color: #e84040; font-weight: 700; }

  /* Tick counter */
  .tick-cell { text-align: center; width: 80px; }
  .tick-counter { display: flex; align-items: center; justify-content: center; gap: 4px; }
  .tick-minus, .tick-plus {
    width: 22px; height: 22px; border-radius: 3px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    line-height: 1; transition: all 0.15s; padding: 0;
  }
  .tick-plus:hover { border-color: var(--green); color: var(--green); background: rgba(46,204,113,0.1); }
  .tick-minus:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(232,82,58,0.1); }
  .tick-minus:disabled { opacity: 0.2; cursor: not-allowed; }
  .tick-num { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; min-width: 20px; text-align: center; color: var(--muted); }
  .tick-num.ticked { color: var(--green); }

  /* Live indicator */
  .live-dot { display: inline-block; width: 7px; height: 7px; background: var(--green); border-radius: 50%; margin-right: 5px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  #live-status { font-size: 0.65rem; color: var(--green); display: none; margin-top: 2px; }


  /* Zero qty section */
  #zero-section { padding: 0 2.5rem 3rem; display: none; }
  .zero-heading {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.7rem;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 1.5rem; margin-bottom: 1rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .zero-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .zero-count { font-family: 'IBM Plex Mono', monospace; font-weight: 400; color: var(--border); font-size: 0.65rem; }
  #zero-table { width: 100%; border-collapse: collapse; font-size: 0.68rem; opacity: 0.45; }
  #zero-table td { padding: 0.35rem 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.02); white-space: nowrap; color: var(--muted); }
  #zero-table tr:hover td { opacity: 0.7; }
  #zero-table .part-id { font-weight: 500; color: var(--text); }
  #zero-table .num-cell { text-align: center; }
  .zero-badge { display: inline-block; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.55rem; padding: 1px 6px; border-radius: 2px; color: var(--muted); border: 1px solid var(--border); }

  @media print {
    body { background: white; color: black; }
    header, #stats-bar, #actions-bar { display: none !important; }
    #table-wrap { display: block !important; padding: 0; }
    table { font-size: 8pt; }
    th { color: #333 !important; background: #eee !important; }
    tr.rank1 td { background: #fce4d6 !important; }
    tr.rank2 td { background: #ddeeff !important; }
    tr.completed { display: none; }
    .tick-cell { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-mark">DCD</div>
  <div>
    <h1>Priority Work List</h1>
    <p>Auto-loads latest data · Live completion tracking</p>
  </div>
  <div class="header-right">
    <div id="date-badge"></div>
    <div id="last-updated"></div>
    <div id="live-status"><span class="live-dot"></span>Live sync active</div>
  </div>
</header>

<div id="loading-bar">
  <div class="spinner"></div>
  <div id="loading-msg">Loading latest data...</div>
</div>
<div id="error-msg"></div>

<div id="stats-bar">
  <div class="stat"><span class="stat-label">Rank 1 — Backorder</span><span class="stat-value r1" id="stat-r1">—</span></div>
  <div class="stat"><span class="stat-label">Rank 2 — PowerBI</span><span class="stat-value r2" id="stat-r2">—</span></div>
  <div class="stat"><span class="stat-label">Total Parts</span><span class="stat-value" id="stat-total">—</span></div>
  <div class="stat"><span class="stat-label">Completed Today</span><span class="stat-value done" id="stat-done">0</span></div>
</div>

<div id="actions-bar">
  <input id="search-input" type="search" placeholder="Search Part ID or team..." oninput="renderTable()"/>
  <button id="show-done-btn" onclick="toggleDone()">Hide Completed</button>
  <button id="refresh-btn" onclick="loadAll()">↻ Refresh</button>
  <button id="export-btn" onclick="exportXLSX()">Export to Excel</button>
  <button id="reset-btn" onclick="resetTicks()">Reset All Ticks</button>
  <span id="row-count"></span>
</div>

<div id="table-wrap">
  <table>
    <thead>
      <tr>
        <th class="tick-cell">Ticked</th>
        <th onclick="sortBy('Priority')">Priority <span>↕</span></th>
        <th onclick="sortBy('Part ID')">Part ID <span>↕</span></th>
        <th onclick="sortBy('Repair Team')">Team <span>↕</span></th>
        <th onclick="sortBy('Rep Req')" class="num-cell">Rep Req <span>↕</span></th>
        <th onclick="sortBy('Open Orders')" class="num-cell">Open Orders <span>↕</span></th>
        <th onclick="sortBy('Total Qty')" class="num-cell">Total Qty <span>↕</span></th>
        <th onclick="sortBy('Part Class')" class="num-cell">Class <span>↕</span></th>
        <th onclick="sortBy('Value')" class="num-cell">Value <span>↕</span></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<div id="zero-section">
  <div class="zero-heading">No Quantity <span class="zero-count" id="zero-count"></span></div>
  <table id="zero-table">
    <tbody id="zero-body"></tbody>
  </table>
</div>

function safeKey(partId) {
  return partId.replace(/[.#$\[\]]/g, '_');
}

function addTick(partId) {
  const key = safeKey(partId);
  const current = (ticks[key] && typeof ticks[key] === 'object') ? (ticks[key].count || 0) : 0;
  TICKS_REF.child(key).set({ count: current + 1 });
}

function removeTick(partId) {
  const key = safeKey(partId);
  const current = (ticks[key] && typeof ticks[key] === 'object') ? (ticks[key].count || 0) : 0;
  if (current <= 1) {
    TICKS_REF.child(key).remove();
  } else {
    TICKS_REF.child(key).set({ count: current - 1 });
  }
}

function getTickCount(partId) {
  const key = safeKey(partId);
  const tick = ticks[key];
  if (!tick) return 0;
  if (typeof tick === 'object') return tick.count || 0;
  return tick ? 1 : 0;
}

function getEffectiveRow(row) {
  const count = getTickCount(row['Part ID']);
  if (count === 0) return row;

  const origOpenOrders = typeof row['Open Orders'] === 'number' ? row['Open Orders'] : 0;
  const origTotalQty = typeof row['Total Qty'] === 'number' ? row['Total Qty'] : 0;
  const origRepReq = typeof row['Rep Req'] === 'number' ? row['Rep Req'] : 0;

  const newOpenOrders = row.Priority === 1 ? Math.max(0, origOpenOrders - count) : origOpenOrders;
  const newTotalQty = Math.max(0, origTotalQty - count);
  const newRepReq = Math.max(0, origRepReq - count);

  return { ...row, 'Open Orders': newOpenOrders, 'Total Qty': newTotalQty, 'Rep Req': newRepReq, _tickCount: count };
}

function updateDoneCount() {
  const count = Object.values(ticks).reduce((sum, v) => sum + (typeof v === 'object' ? (v.count || 0) : (v ? 1 : 0)), 0);
  document.getElementById('stat-done').textContent = count;
}

async function fetchFile(filename) {
  const url = `${RAW}/${encodeURIComponent(filename)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not load "${filename}" (HTTP ${res.status})`);
  return await res.arrayBuffer();
}

async function loadXLSX(filename) {
  const buf = await fetchFile(filename);
  const wb = XLSX.read(buf, { type: 'array' });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
}

async function loadCSV(filename) {
  const buf = await fetchFile(filename);
  const text = new TextDecoder('utf-8').decode(buf);
  const sections = text.trim().split(/\n\n+/);
  const allRows = [];
  sections.forEach(sec => {
    const wb = XLSX.read(sec, { type: 'string' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    rows.forEach(r => {
      const norm = {};
      Object.keys(r).forEach(k => {
        if (/^part_id/i.test(k)) norm['Part ID'] = String(r[k]).trim();
        if (/^qty/i.test(k)) norm['Qty'] = Number(r[k]) || 0;
      });
      if (norm['Part ID']) allRows.push(norm);
    });
  });
  return allRows;
}

async function loadAll() {
  document.getElementById('loading-bar').style.display = 'flex';
  document.getElementById('stats-bar').style.display = 'none';
  document.getElementById('actions-bar').style.display = 'none';
  document.getElementById('table-wrap').style.display = 'none';
  document.getElementById('error-msg').style.display = 'none';

  try {
    document.getElementById('loading-msg').textContent = 'Loading PowerBI data...';
    const pbiRows = await loadXLSX('Both PowerBi Complete.xlsx');

    document.getElementById('loading-msg').textContent = 'Loading backorder report...';
    const boRows = await loadCSV('New Repair Centre Back Order Report v1.csv');

    document.getElementById('loading-msg').textContent = 'Loading part gradings...';
    const gradingRows = await loadXLSX('Part Gradings.xlsx');

    document.getElementById('loading-msg').textContent = 'Building priority list...';

    const gradeMap = {};
    gradingRows.forEach(r => {
      const id = (r['Part ID'] || r['part_id'] || '').toString().trim();
      const cls = (r['Part Class'] || r['part_class'] || '').toString().trim();
      if (id && cls) gradeMap[id] = cls;
    });

    const pbiMap = {};
    pbiRows.forEach(r => {
      const id = (r['Part ID'] || '').toString().trim();
      if (!id || !DCD_PARTS.has(id)) return;
      pbiMap[id] = { repReq: Number(r['Rep Req']) || 0, totalBad: Number(r['Total Bad']) || 0, team: (r['Repair Team'] || '').toString().trim() };
    });

    const boMap = {};
    boRows.forEach(r => {
      const id = (r['Part ID'] || '').toString().trim();
      if (!id || !DCD_PARTS.has(id)) return;
      if (!boMap[id]) boMap[id] = { count: 0, totalQty: 0 };
      boMap[id].count++;
      boMap[id].totalQty += Number(r['Qty']) || 0;
    });

    const boIds = new Set(Object.keys(boMap));
    const rank1 = [], rank2 = [];

    Object.keys(boMap).forEach(id => {
      const bo = boMap[id], pbi = pbiMap[id] || { repReq: 0, totalBad: 0, team: '' };
      const cls = gradeMap[id] || '';
      rank1.push({ Priority: 1, 'Part ID': id, 'Repair Team': pbi.team, 'Rep Req': pbi.repReq, 'Open Orders': bo.count, 'Total Qty': bo.totalQty, 'Part Class': cls, Value: GRADE_VALUE[cls] ?? '' });
    });
    rank1.sort((a, b) => b['Open Orders'] - a['Open Orders']);

    Object.keys(pbiMap).forEach(id => {
      if (boIds.has(id)) return;
      const pbi = pbiMap[id];
      if (pbi.repReq === 0) return;
      const cls = gradeMap[id] || '';
      rank2.push({ Priority: 2, 'Part ID': id, 'Repair Team': pbi.team, 'Rep Req': pbi.repReq, 'Open Orders': '', 'Total Qty': pbi.totalBad, 'Part Class': cls, Value: GRADE_VALUE[cls] ?? '' });
    });
    rank2.sort((a, b) => b['Rep Req'] - a['Rep Req']);

    outputRows = [...rank1, ...rank2];

    document.getElementById('stat-r1').textContent = rank1.length;
    document.getElementById('stat-r2').textContent = rank2.length;
    document.getElementById('stat-total').textContent = outputRows.length;
    document.getElementById('loading-bar').style.display = 'none';
    document.getElementById('stats-bar').style.display = 'flex';
    document.getElementById('actions-bar').style.display = 'flex';
    document.getElementById('table-wrap').style.display = 'block';
    document.getElementById('last-updated').style.display = 'block';
    document.getElementById('last-updated').textContent = 'Loaded at ' + new Date().toLocaleTimeString('en-GB');
    document.getElementById('live-status').style.display = 'block';
    sortCol = null;
    renderTable();
  } catch(err) {
    document.getElementById('loading-bar').style.display = 'none';
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('error-msg').textContent = '⚠ ' + err.message;
  }
}

function renderTable() {
  const search = document.getElementById('search-input').value.toLowerCase();
  let rows = outputRows.filter(r => {
    if (Number(r['Total Qty']) === 0 || r['Total Qty'] === '') return false;
    const eff = getEffectiveRow(r);
    // Remove from list if rep req drops to 0 after tick (rank 2 only)
    if (getTickCount(r['Part ID']) > 0 && eff['Rep Req'] === 0) return false;
    if (!showDone && getTickCount(r['Part ID']) > 0) return false;
    return !search || r['Part ID'].toLowerCase().includes(search) || (r['Repair Team'] || '').toLowerCase().includes(search);
  });
  if (sortCol) {
    rows = [...rows].sort((a, b) => {
      let av = a[sortCol], bv = b[sortCol];
      if (av === '' || av == null) av = sortAsc ? Infinity : -Infinity;
      if (bv === '' || bv == null) bv = sortAsc ? Infinity : -Infinity;
      if (typeof av === 'number' && typeof bv === 'number') return sortAsc ? av - bv : bv - av;
      return sortAsc ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
  }
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  rows.forEach(row => {
    const eff = getEffectiveRow(row);
    const tickCount = getTickCount(row['Part ID']);
    const isDone = tickCount > 0;

    // Determine effective priority after tick
    let effPriority = eff.Priority;
    if (isDone && eff.Priority === 1 && eff['Open Orders'] === 0) effPriority = 2;

    // If rep req is 0 after ticking, skip entirely (handled in filter)
    const tr = document.createElement('tr');
    tr.className = isDone ? 'completed' : (effPriority === 1 ? 'rank1' : 'rank2');
    const cls = eff['Part Class'] || '';
    const valStr = typeof eff.Value === 'number' ? `£${eff.Value.toFixed(2)}` : '';
    const partId = eff['Part ID'];

    // Show effective badge based on open orders
    const displayPriority = (eff.Priority === 1 && isDone && eff['Open Orders'] === 0) ? 2 : eff.Priority;
    const openOrdersDisplay = eff.Priority === 1
      ? (isDone ? eff['Open Orders'] : (eff['Open Orders'] !== '' ? eff['Open Orders'] : ''))
      : '';

    const tickCount = getTickCount(partId);
    tr.innerHTML = `
      <td class="tick-cell">
        <div class="tick-counter">
          <button class="tick-minus" onclick="removeTick('${partId}')" ${tickCount === 0 ? 'disabled' : ''}>−</button>
          <span class="tick-num ${tickCount > 0 ? 'ticked' : ''}">${tickCount}</span>
          <button class="tick-plus" onclick="addTick('${partId}')">+</button>
        </div>
      </td>
      <td><span class="badge badge-${displayPriority}">${displayPriority}</span></td>
      <td class="part-id">${partId}</td>
      <td>${eff['Repair Team'] || ''}</td>
      <td class="num-cell">${eff['Rep Req'] !== '' ? eff['Rep Req'] : ''}</td>
      <td class="num-cell">${openOrdersDisplay !== '' ? openOrdersDisplay : ''}</td>
      <td class="num-cell">${eff['Total Qty'] !== '' ? eff['Total Qty'] : ''}</td>
      <td class="num-cell grade-${cls}">${cls}</td>
      <td class="num-cell">${valStr}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('row-count').textContent = `${rows.length} parts shown`;

  // Zero qty section
  const zeroRows = outputRows.filter(r => (Number(r['Total Qty']) === 0 || r['Total Qty'] === '') && !ticks[safeKey(r['Part ID'])]);
  const zeroSection = document.getElementById('zero-section');
  const zeroBody = document.getElementById('zero-body');
  document.getElementById('zero-count').textContent = `(${zeroRows.length})`;
  zeroBody.innerHTML = '';
  if (zeroRows.length > 0 && outputRows.length > 0) {
    zeroSection.style.display = 'block';
    zeroRows.forEach(row => {
      const tr = document.createElement('tr');
      const cls = row['Part Class'] || '';
      const valStr = typeof row.Value === 'number' ? `£${row.Value.toFixed(2)}` : '';
      tr.innerHTML = `
        <td><span class="zero-badge">${row.Priority}</span></td>
        <td class="part-id">${row['Part ID']}</td>
        <td>${row['Repair Team'] || ''}</td>
        <td class="num-cell">${row['Rep Req'] !== '' ? row['Rep Req'] : ''}</td>
        <td class="num-cell">—</td>
        <td class="num-cell grade-${cls}">${cls}</td>
        <td class="num-cell">${valStr}</td>`;
      zeroBody.appendChild(tr);
    });
  } else {
    zeroSection.style.display = 'none';
  }
}

function sortBy(col) {
  sortAsc = sortCol === col ? !sortAsc : false;
  sortCol = col;
  renderTable();
}

function exportXLSX() {
  if (!outputRows.length) return;
  const wb = XLSX.utils.book_new();
  const data = outputRows.map(r => ({
    'Priority': r.Priority, 'Part ID': r['Part ID'], 'Repair Team': r['Repair Team'],
    'Rep Req': r['Rep Req'], 'Open Orders': r['Open Orders'], 'Total Qty': r['Total Qty'],
    'Part Class': r['Part Class'], 'Value': r.Value !== '' ? `£${Number(r.Value).toFixed(2)}` : '',
    'Completed': ticks[safeKey(r['Part ID'])] ? 'Yes' : 'No'
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [8,32,12,8,10,10,8,8,10].map(w => ({ wch: w }));
  XLSX.utils.book_append_sheet(wb, ws, 'Priority Work List');
  XLSX.writeFile(wb, `DCD_Priority_${new Date().toISOString().slice(0,10)}.xlsx`);
}

loadAll();
</script>
</body>
</html>
